# This GitHub Actions workflow is designed to manually build and optionally push a Docker image to DockerHub and GHCR.
#
# Workflow Name: build-docker-manual
#
# Inputs:
# - dockerfile: Path to the Dockerfile in the repository (e.g., common/ccbr_bwa/Dockerfile). This input is required.
# - dockerhub-namespace: DockerHub namespace or organization name (e.g., nciccbr). This input is required and defaults to 'nciccbr'.
# - registries: Comma-separated registries to push to; defaults to DockerHub and GHCR.
# - push: Boolean flag to determine whether to push the built image. This input is required and defaults to 'false'.
#
# Jobs:
# - build-docker: This job runs on an Ubuntu latest runner and performs the following steps:
#   - Checks out the repository.
#   - Logs in to the selected registries if the 'push' input is set to 'true'.
#   - Prepares build-time variables by running a custom script.
#   - Checks variables and creates a temporary README file with build details.
#   - Builds and optionally pushes the Docker image using the docker/build-push-action.
#   - Lists Docker images on the runner.
#   - Updates the DockerHub description with the contents of the temporary README file if the image was successfully pushed.

name: build-docker-manual
run-name: build-docker ${{ inputs.dockerfile }}-${{ inputs.suffix }}

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      dockerfile:
        type: string
        description: path to the Dockerfile in the repo (e.g.
          base_images/ccbr_ubuntu_22.04/Dockerfile.v4)
        required: true
      dockerhub-namespace:
        type: string
        description: dockerhub namespace or org name (e.g. nciccbr)
        required: true
        default: nciccbr
      suffix:
        type: string
        description: Suffix to add to image tag (e.g. "dev" to add "-dev")
        required: true
        default: feat
      push:
        type: boolean
        description:
          Push to the selected registries (leave unchecked to just build the container
          without pushing)
        required: true
        default: false
      registries:
        type: string
        description: Comma-separated registries to use (dockerhub, ghcr)
        required: true
        default: dockerhub,ghcr
      platforms:
        type: string
        description: Comma-separated build platforms (e.g. linux/amd64,linux/arm64)
        required: false
        default: ""
      ccbr-actions-version:
        description: "The version or branch of ccbr_actions to use (see
          https://github.com/ccbr/actions)"
        required: true
        default: "latest"

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: "write"
      pull-requests: write
      packages: write
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: CCBR/actions/build-docker@v0.8.3
        with:
          dockerfile: ${{ github.event.inputs.dockerfile }}
          dockerhub-namespace: ${{ github.event.inputs.dockerhub-namespace }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME_VK }}
          dockerhub-token: ${{ secrets.DOCKERHUBRW_TOKEN_VK }}
          suffix: ${{ github.event.inputs.suffix }}
          push: ${{ github.event.inputs.push }}
          registries: ${{ github.event.inputs.registries }}
          platforms: ${{ github.event.inputs.platforms }}
          ccbr-actions-version: ${{ github.event.inputs.ccbr-actions-version }}
          github-token: ${{ github.token }}
          github-actor: ${{ github.actor }}
