name: build-docker
description: "Build a docker container using CCBR guidelines"
author: "Vishal Koparde & Kelly Sovacool"

inputs:
  dockerfile:
    description: |
      path to the Dockerfile in the repo (e.g. common/ccbr_bwa/Dockerfile).
    required: true
  dockerhub-namespace:
    description: |
      dockerhub namespace or org name (e.g. nciccbr).
    required: true
    default: nciccbr
  dockerhub-username:
    description: |
      dockerhub username of a user with admin permissions for `dockerhub-namespace`. Recommend using secrets, e.g. secrets.DOCKERHUB_USERNAME.
    required: false
  dockerhub-token:
    description: |
      dockerhub token with read & write permissions. Strongly recommend using secrets, e.g. secrets.DOCKERHUB_TOKEN.
    required: false
  ghcr-namespace:
    description: |
      GitHub Container Registry owner or organization name. Defaults to the repository owner.
    required: false
  registries:
    description: |
      Comma-separated registries to push to (dockerhub, ghcr).
    required: true
    default: dockerhub,ghcr
  platforms:
    description: |
      Comma-separated target platforms for a multi-platform build (e.g. linux/amd64,linux/arm64).
    required: false
    default: ""
  suffix:
    description: |
      Suffix to add to image tag eg. "dev" to add "-dev".
    required: true
    default: feat
  push:
    description: |
      Push to selected registries (if false, just build the container without pushing).
    required: true
    default: "false"
  force_build:
    description: |
      Force docker image build even when the Docker Hub tag is up-to-date.
    required: true
    default: "false"
  ccbr-actions-version:
    description: |
      The version of ccbr_actions to install in the image.
      This value is passed to the Dockerfile as CCBR_ACTIONS_VERSION.
    required: true
    default: "latest"
  python-version:
    description: |
      The version of Python to install.
    required: true
    default: "3.14"
  github-actor:
    description: |
      GitHub username for README commits and GHCR authentication.
    required: true
    default: "258092125+CCBR-bot[bot]"
  github-token:
    description: |
      GitHub Actions token used for GitHub API operations and GHCR authentication.
    required: true
  print-versions:
    description: |
      Whether to print tool versions in the container for the README file using `config-file`.
    default: "true"
  config-file:
    description: |
      Relative path to config file for tool version commands (text format with :: delimiters).
      If not provided and print-versions is true, the default config file from ccbr_actions will be used.
    default: "scripts/tool_version_commands.txt"
  gh-merge-args:
    description: |
      arguments for `gh pr merge`.
    default: "-ds --admin"
outputs:
  push_success:
    description: "Whether Docker succeeded for this run"
    value: ${{ steps.resolve_push.outputs.push_enabled == 'true' && steps.build_and_push.outcome == 'success' }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "${{ inputs.python-version }}"
        cache: pip

    - name: Install ccbr_actions
      shell: bash
      run: pip install --upgrade pip git+https://github.com/CCBR/actions.git@${{ inputs.ccbr-actions-version }}

    - name: Resolve push mode
      id: resolve_push
      shell: bash
      env:
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_REGISTRIES: ${{ inputs.registries }}
        INPUT_DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
        INPUT_DOCKERHUB_TOKEN: ${{ inputs.dockerhub-token }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        registries=$(printf '%s' "${INPUT_REGISTRIES}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
        if [[ -z "${registries}" ]]; then
          echo "::error::At least one registry must be selected."
          exit 1
        fi

        push_dockerhub=false
        push_ghcr=false
        IFS=',' read -r -a registry_list <<< "${registries}"
        for registry in "${registry_list[@]}"; do
          case "${registry}" in
            dockerhub|ghcr) ;;
            *)
              echo "::error::Unsupported registry '${registry}'. Choose dockerhub and/or ghcr."
              exit 1
              ;;
          esac
        done

        push_enabled=false
        if [[ "${INPUT_PUSH}" == "true" ]]; then
          if [[ " ${registries//,/ } " == *" dockerhub "* ]]; then
            if [[ -n "${INPUT_DOCKERHUB_USERNAME}" && -n "${INPUT_DOCKERHUB_TOKEN}" ]]; then
              push_dockerhub=true
            else
              echo "::warning::DockerHub credentials are missing. Skipping DockerHub push."
            fi
          fi
          if [[ " ${registries//,/ } " == *" ghcr "* ]]; then
            if [[ -n "${INPUT_GITHUB_TOKEN}" ]]; then
              push_ghcr=true
            else
              echo "::warning::GitHub token is missing. Skipping GHCR push."
            fi
          fi
          if [[ "${push_dockerhub}" == "true" || "${push_ghcr}" == "true" ]]; then
            push_enabled=true
          else
            echo "::warning::No selected registry has credentials. Building image without push."
          fi
        fi
        echo "push_enabled=${push_enabled}" >> "$GITHUB_OUTPUT"
        echo "push_dockerhub=${push_dockerhub}" >> "$GITHUB_OUTPUT"
        echo "push_ghcr=${push_ghcr}" >> "$GITHUB_OUTPUT"

    - name: Login to DockerHub
      id: login_dockerhub
      if: ${{ steps.resolve_push.outputs.push_dockerhub == 'true' }}
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Login to GitHub Container Registry
      id: login_ghcr
      if: ${{ steps.resolve_push.outputs.push_ghcr == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.github-actor }}
        password: ${{ inputs.github-token }}

    - name: Prepare build-time variables
      shell: bash
      id: prepare_vars
      env:
        DOCKERFILE_INPUT: ${{ inputs.dockerfile }}
        SUFFIX_INPUT: ${{ inputs.suffix }}
        DOCKERHUB_NAMESPACE_INPUT: ${{ inputs.dockerhub-namespace }}
      run: |
        cd "$GITHUB_WORKSPACE"
        python "$GITHUB_ACTION_PATH/../scripts/prepare_docker_build_variables.py" \
          "$DOCKERFILE_INPUT" "$SUFFIX_INPUT" "$DOCKERHUB_NAMESPACE_INPUT"

    - name: Check variables and create README
      shell: bash
      id: check_and_create_readme
      run: |
        cd "$GITHUB_WORKSPACE"
        echo "DOCKERFILE_PATH: $DOCKERFILE_PATH"
        echo "DOCKERFILE_BASENAME: $DOCKERFILE_BASENAME"
        echo "IMAGENAME: $IMAGENAME"
        echo "BASEIMAGENAME: $BASEIMAGENAME"
        echo "BUILD_DATE: $BUILD_DATE"
        echo "BUILD_TAG: $BUILD_TAG"
        echo "REPONAME: $REPONAME"
        echo "MDFILE: $MDFILE"
        echo -ne "## ${{ github.repository }} $IMAGENAME\n\n" > $MDFILE
        echo "Dockerfile source: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/${{ inputs.dockerfile }}" >> $MDFILE
        echo -ne "\n\n" >> $MDFILE
        echo -ne "Built on: $BUILD_DATE \n\n" >> $MDFILE
        echo -ne "Build tag: $BUILD_TAG \n\n" >> $MDFILE
        echo -ne "Base image: $BASEIMAGENAME \n\n" >> $MDFILE
        echo -ne "Dockerfile path in repo: $DOCKERFILE_PATH \n\n" >> $MDFILE

    - name: Prepare image tags
      id: prepare_image_tags
      shell: bash
      env:
        PUSH_ENABLED: ${{ steps.resolve_push.outputs.push_enabled }}
        PUSH_DOCKERHUB: ${{ steps.resolve_push.outputs.push_dockerhub }}
        PUSH_GHCR: ${{ steps.resolve_push.outputs.push_ghcr }}
        GHCR_NAMESPACE_INPUT: ${{ inputs.ghcr-namespace }}
      run: |
        tags=()
        image_repo="${REPONAME:-${GITHUB_REPOSITORY#*/}}"
        if [[ "${PUSH_ENABLED}" != "true" ]]; then
          tags+=("${IMAGENAME}")
        else
          if [[ "${PUSH_DOCKERHUB}" == "true" ]]; then
            tags+=("${IMAGENAME}")
          fi
          if [[ "${PUSH_GHCR}" == "true" ]]; then
            ghcr_namespace="${GHCR_NAMESPACE_INPUT:-${GITHUB_REPOSITORY_OWNER}}"
            tags+=("ghcr.io/${ghcr_namespace,,}/${image_repo,,}:${BUILD_TAG}")
          fi
        fi
        printf 'tags<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${tags[@]}")" >> "$GITHUB_OUTPUT"

    - name: Check whether image tag is stale
      id: check_tag_staleness
      shell: bash
      env:
        INPUT_FORCE_BUILD: ${{ inputs.force_build }}
        INPUT_PUSH_GHCR: ${{ steps.resolve_push.outputs.push_ghcr }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        DOCKERFILE_PATH_INPUT: ${{ env.DOCKERFILE_PATH }}
        IMAGE_NAME_INPUT: ${{ env.IMAGENAME }}
        DOCKERHUB_NAMESPACE_INPUT: ${{ inputs.dockerhub-namespace }}
        REPO_NAME_INPUT: ${{ env.REPONAME }}
      run: |
        cd "$GITHUB_WORKSPACE"
        if [[ "${INPUT_PUSH_GHCR}" == "true" || -n "${INPUT_PLATFORMS}" ]]; then
          INPUT_FORCE_BUILD=true
        fi
        export INPUT_FORCE_BUILD
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        python "$GITHUB_ACTION_PATH/../scripts/check_docker_build_staleness.py" \
          "$DOCKERFILE_PATH_INPUT" "$IMAGE_NAME_INPUT" \
          "$DOCKERHUB_NAMESPACE_INPUT" "$REPO_NAME_INPUT"

    - name: Set up QEMU
      if: ${{ inputs.platforms != '' }}
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push Docker image
      id: build_and_push
      if: ${{ steps.check_tag_staleness.outputs.should_build == 'true' }}
      uses: docker/build-push-action@v7
      with:
        file: ${{ env.DOCKERFILE_PATH }}
        context: ${{ env.CONTEXT }}
        push: ${{ steps.resolve_push.outputs.push_enabled }}
        load: ${{ steps.resolve_push.outputs.push_enabled != 'true' && inputs.platforms == '' }}
        tags: ${{ steps.prepare_image_tags.outputs.tags }}
        platforms: ${{ inputs.platforms }}
        build-args: |
          DOCKERFILE=${{ env.DOCKERFILE_BASENAME }}
          BUILD_DATE=${{ env.BUILD_DATE }}
          BUILD_TAG=${{ env.BUILD_TAG }}
          REPONAME=${{ env.REPONAME }}
          IMAGENAME=${{ env.IMAGENAME }}
          BASEIMAGENAME=${{ env.BASEIMAGENAME }}

    - name: Run print_versions.sh inside Docker container
      shell: bash
      id: run_script_in_container
      if: ${{ (inputs.print-versions == 'true') && (steps.check_tag_staleness.outputs.should_build == 'true') && (inputs.platforms == '' || steps.resolve_push.outputs.push_enabled == 'true') }}
      env:
        PUSH_ENABLED: ${{ steps.resolve_push.outputs.push_enabled }}
        PUSH_GHCR: ${{ steps.resolve_push.outputs.push_ghcr }}
        GHCR_NAMESPACE_INPUT: ${{ inputs.ghcr-namespace }}
        IMAGE_NAME_INPUT: ${{ env.IMAGENAME }}
      run: |
        cd "$GITHUB_WORKSPACE"
        image_to_run="${IMAGE_NAME_INPUT}"
        if [[ "${PUSH_ENABLED}" == "true" ]]; then
          if [[ "${PUSH_GHCR}" == "true" ]]; then
            ghcr_namespace="${GHCR_NAMESPACE_INPUT:-${GITHUB_REPOSITORY_OWNER}}"
            image_repo="${REPONAME:-${GITHUB_REPOSITORY#*/}}"
            image_to_run="ghcr.io/${ghcr_namespace,,}/${image_repo,,}:${BUILD_TAG}"
          fi
          docker pull "${image_to_run}"
        fi
        EXTRA_MOUNTS=""
        script_src=$(command -v print_versions.sh)
        if [ -f "${{ inputs.config-file }}" ]; then
          CONFIG_FILE="/ws/${{ inputs.config-file }}"
        else
          config_src=$(python -c 'import ccbr_actions.data; print(ccbr_actions.data.get_file_path("tool_version_commands.txt"))')
          CONFIG_FILE="/ws/tool_version_commands.txt"
          EXTRA_MOUNTS="-v ${config_src}:/ws/tool_version_commands.txt:ro"
        fi
        docker run --rm --entrypoint /bin/bash \
          -v "${{ github.workspace }}:/ws" \
          -v "${script_src}:/ws/print_versions.sh:ro" \
          ${EXTRA_MOUNTS} \
          "${image_to_run}" -lc \
          "bash /ws/print_versions.sh --config ${CONFIG_FILE} --output /ws/${{ env.MDFILE }}"

    - name: Update Docker Hub Description
      id: update_dockerhub_description
      if: ${{ (steps.check_tag_staleness.outputs.should_build == 'true') && (steps.resolve_push.outputs.push_dockerhub == 'true') && (steps.build_and_push.outcome == 'success') }}
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}
        repository: ${{ inputs.dockerhub-namespace }}/${{ env.REPONAME }}
        readme-filepath: ${{ env.MDFILE }}

    - name: Create Pull Request
      id: create-pr
      uses: peter-evans/create-pull-request@v8
      if: ${{ steps.update_dockerhub_description.outcome == 'success' }}
      with:
        token: ${{ inputs.github-token }}
        add-paths: ${{ env.MDFILE }}
        commit-message: "docs: 🤖 update readme for ${{ env.DOCKERFILE_PATH }}"
        author: "${{ inputs.github-actor }} <${{ inputs.github-actor }}@users.noreply.github.com>"
        committer: "${{ inputs.github-actor }} <${{ inputs.github-actor }}@users.noreply.github.com>"
        branch: "auto-pr/${{ env.DOCKERFILE_PATH }}"
        title: "docs: 🤖 update readme for ${{ env.IMAGENAME }}"

    - name: Approve PR
      shell: bash
      id: approve-pr
      if: ${{ (steps.create-pr.outputs.pull-request-number != '') && (steps.create-pr.outputs.pull-request-operation == 'created') || (steps.create-pr.outputs.pull-request-operation == 'updated') }}
      run: |
        gh pr merge ${args} ${PR}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        args: ${{ inputs.gh-merge-args }}
        PR: ${{ steps.create-pr.outputs.pull-request-number }}

    - name: upload readme file
      uses: actions/upload-artifact@v7
      if: ${{ (steps.check_tag_staleness.outputs.should_build == 'true') && (failure() || steps.approve-pr.outcome != 'success') }}
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.MDFILE }}
