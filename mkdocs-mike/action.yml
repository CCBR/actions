name: "mkdocs-mike"
description: "Deploy documentation to github pages using mkdocs + mike"
author: "Kelly Sovacool"
inputs:
  github-token:
    description: "GitHub Actions token (e.g. { github.token })."
    required: true
  ccbr-actions-version:
    description: "The version of ccbr_actions to install when running outside the ccbr_actions container."
    required: true
    default: "latest"
  python-version:
    description: "The version of Python to install."
    required: true
    default: "3.14"
  docs-branch:
    description: "The branch to deploy the docs website to."
    required: true
    default: "gh-pages"
  github-actor:
    description: "Username of GitHub actor for the git commit when the docs branch is deployed."
    required: true
    default: "41898282+github-actions[bot]"
  strict-semver:
    description: "Whether to follow strict semantic versioning guidelines."
    type: boolean
    default: true
  dry-run:
    description: "Print the mike deploy command without deploying the docs."
    default: "false"
outputs:
  version:
    description: "The version of the docs being deployed."
    value: ${{ steps.set-version.outputs.version }}
  alias:
    description: "The alias of the version being deployed."
    value: ${{ steps.set-version.outputs.alias }}
runs:
  using: "composite"
  steps:
    - name: Detect ccbr_actions container
      id: detect-container
      shell: bash
      # env vars baked into the container image are not visible to the `env` context in `if:` expressions
      run: echo "in-container=${CCBR_ACTIONS_DOCKER:-false}" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      if: ${{ steps.detect-container.outputs.in-container != 'true' }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: git config
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --local user.email "${{ inputs.github-actor }}@users.noreply.github.com"
        git config --local user.name "${{ inputs.github-actor }}"
    - name: Install ccbr_actions
      if: ${{ steps.detect-container.outputs.in-container != 'true' }}
      shell: bash
      run: pip install --upgrade pip git+https://github.com/CCBR/actions.git@${{ inputs.ccbr-actions-version }}
    - name: Install docs dependencies
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE"
        if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
    - name: set version tag & alias for mike
      id: set-version
      shell: python {0}
      run: |
        import os

        from ccbr_actions.docs import set_docs_version

        os.chdir(os.environ["GITHUB_WORKSPACE"])
        release_tag="${{ github.event.release.tag_name }}" if "${{ github.event_name }}" == "release" else None
        strict_semver = "${{ inputs.strict-semver }}" == "true"

        # set VERSION and ALIAS env vars
        set_docs_version(repo='${{ github.repository }}', release_tag=release_tag, strict_semver = strict_semver)

      env:
        GH_TOKEN: ${{ inputs.github-token }}
    - name: deploy docs
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        VERSION: ${{ steps.set-version.outputs.version }}
        ALIAS: ${{ steps.set-version.outputs.alias }}
        DOCS_BRANCH: ${{ inputs.docs-branch }}
      run: |
        cd "$GITHUB_WORKSPACE"
        deploy_cmd=(mike deploy $VERSION $ALIAS --push --update-aliases --branch "$DOCS_BRANCH")
        if [ "$DRY_RUN" = "true" ]; then
          echo "Dry run, not deploying the docs: ${deploy_cmd[*]}"
          exit 0
        fi
        "${deploy_cmd[@]}"
