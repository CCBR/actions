name: user-projects
description: "Add issue/PR to user's project"
author: "Kelly Sovacool"

inputs:
  username:
    required: false
    description: "GitHub username of the person assigned to the Issue or PR."
    default: ${{ github.event.assignee.login }}
  user_projects:
    required: false
    description: "URL of a yaml file mapping usernames to project boards."
    default: https://raw.githubusercontent.com/CCBR/.github/main/assets/user-kanbans.yml
  github-token:
    description: "GitHub Actions token with access to organization projects. Optional - set the client-id and app-private-key instead."
    required: false
    default: ""
  client-id:
    description: "GitHub App Client ID for authentication. Optional - use this instead of a token."
    required: false
    default: ""
  app-id:
    description: "Legacy GitHub App ID input. Prefer client-id."
    required: false
    default: ""
  app-private-key:
    description: "Private key for the GitHub App used for authentication. Optional - must be set if client-id or app-id is set."
    required: false
    default: ""
  token-owner:
    description: "Owner of the resources that the GitHub app will use for authentication. Optional - use this if using client-id or app-id and app-private-key."
    required: false
    default: "CCBR"

runs:
  using: composite
  steps:
    - name: download yaml
      shell: bash
      run: |
        wget ${{ inputs.user_projects }}

    - uses: pietrobolcato/action-read-yaml@1.1.0
      id: metadata
      with:
        config: user-kanbans.yml

    - name: echo
      shell: bash
      run: |
        echo ${{ inputs.username }} ${{ steps.metadata.outputs[inputs.username] }}

    - name: Generate a token from client ID
      id: generate-token-client
      if: ${{ inputs.github-token == '' && inputs.client-id != '' }}
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.token-owner }}

    - name: Generate a token from legacy app ID
      id: generate-token-app
      if: ${{ inputs.github-token == '' && inputs.client-id == '' && inputs.app-id != '' }}
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.token-owner }}

    - name: Set GitHub token from app
      if: ${{ inputs.github-token == '' }}
      shell: bash
      run: |
        echo "GITHUB_TOKEN=${{ steps.generate-token-client.outputs.token || steps.generate-token-app.outputs.token }}" >> $GITHUB_ENV

    - name: Set GitHub token from input
      if: ${{ inputs.github-token != '' }}
      shell: bash
      run: |
        echo "GITHUB_TOKEN=${{ inputs.github-token }}" >> $GITHUB_ENV

    - uses: actions/add-to-project@v2.0.0
      if: ${{ steps.metadata.outputs[inputs.username] != '' }}
      with:
        project-url: ${{ steps.metadata.outputs[inputs.username] }}
        github-token: ${{ env.GITHUB_TOKEN }}
