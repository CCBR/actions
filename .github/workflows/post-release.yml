name: post-release

on:
  release:
    types:
      - published

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    container: nciccbr/ccbr_actions:latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: CCBR/actions/post-release@latest
        with:
          github-token: ${{ github.token }}
          update-sliding-tags: true
      - name: Pin example workflows to the published release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          release_tag = os.environ["RELEASE_TAG"]
          pattern = re.compile(r"(CCBR/actions/[^@\s]+@)[^\s]+")
          for filepath in pathlib.Path("examples").glob("*.y*ml"):
              text = filepath.read_text()
              updated = pattern.sub(rf"\g<1>{release_tag}", text)
              if updated != text:
                  filepath.write_text(updated)
          docs_path = pathlib.Path("docs/actions/mkdocs-mike/index.qmd")
          text = docs_path.read_text()
          docs_path.write_text(
              re.sub(
                  r"(ccbr-actions-version:\s*)\S+",
                  rf"\g<1>{release_tag}",
                  text,
              )
          )
          PY
          git add examples docs/actions/mkdocs-mike/index.qmd
          git diff --cached --quiet || git commit -m "chore: pin examples to ${RELEASE_TAG}"
          git push
