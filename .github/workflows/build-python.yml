# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        uses: psf/black@stable
        continue-on-error: true
        with:
          options: "--check --verbose"
          use_pyproject: true
      - name: Install dependencies
        run: |
          python -m pip install .[dev,test] --upgrade pip
      - name: Test
        run: |
          python -m pytest --cov ccbr_actions
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          flags: python

  test-actions-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/test-fixtures/actions

  test-actions-container:
    runs-on: ubuntu-latest
    container: nciccbr/ccbr_actions:latest@sha256:1f4e65a53499f7a44a01f66f4ea72657c55bae8ccd56384b113b2e959a32c947
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/test-fixtures/actions

  test-changed-files-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: changed-files
        uses: ./changed-files
        with:
          paths: |
            .github/**
            changed-files/**
          ccbr-actions-version: main
      - name: Verify changed-files outputs
        shell: python {0}
        env:
          ERROR: ${{ steps.changed-files.outputs.error }}
          MATCHED_FILES_JSON: ${{ steps.changed-files.outputs.matched_files_json }}
        run: |
          import json
          import os

          assert not os.environ["ERROR"]
          assert isinstance(json.loads(os.environ["MATCHED_FILES_JSON"]), list)

  test-changed-files-container:
    runs-on: ubuntu-latest
    container: nciccbr/ccbr_actions:latest@sha256:1f4e65a53499f7a44a01f66f4ea72657c55bae8ccd56384b113b2e959a32c947
    steps:
      - uses: actions/checkout@v7
      - id: changed-files
        uses: ./changed-files
        with:
          paths: |
            .github/**
            changed-files/**
      - name: Verify changed-files outputs
        shell: python {0}
        env:
          ERROR: ${{ steps.changed-files.outputs.error }}
          MATCHED_FILES_JSON: ${{ steps.changed-files.outputs.matched_files_json }}
        run: |
          import json
          import os

          assert not os.environ["ERROR"]
          assert isinstance(json.loads(os.environ["MATCHED_FILES_JSON"]), list)

  test-build-docker-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: docker
        uses: ./build-docker
        with:
          dockerfile: tests/data/Dockerfile.v1
          github-token: ${{ github.token }}
          push: false
          print-versions: false
          force_build: false
          suffix: main
          ccbr-actions-version: main
      - name: Verify build-docker did not push
        env:
          PUSH_SUCCESS: ${{ steps.docker.outputs.push_success }}
        run: test "$PUSH_SUCCESS" = "false"

  test-build-docker-container:
    runs-on: ubuntu-latest
    container: nciccbr/ccbr_actions:latest@sha256:1f4e65a53499f7a44a01f66f4ea72657c55bae8ccd56384b113b2e959a32c947
    steps:
      - uses: actions/checkout@v7
      - id: docker
        uses: ./build-docker
        with:
          dockerfile: tests/data/Dockerfile.v1
          github-token: ${{ github.token }}
          push: false
          print-versions: false
          force_build: false
          suffix: main
          ccbr-actions-version: main
      - name: Verify build-docker did not push
        env:
          PUSH_SUCCESS: ${{ steps.docker.outputs.push_success }}
        run: test "$PUSH_SUCCESS" = "false"

  test-install-r-pak-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./install-r-pak
        with:
          versions-file: .github/test-fixtures/r-package-versions.txt
      - name: Verify versions file was available in the workspace
        run: test -f .github/test-fixtures/r-package-versions.txt

  test-install-r-pak-container:
    runs-on: ubuntu-latest
    container: nciccbr/ccbr_actions:latest@sha256:1f4e65a53499f7a44a01f66f4ea72657c55bae8ccd56384b113b2e959a32c947
    steps:
      - uses: actions/checkout@v7
      - uses: ./install-r-pak
        with:
          versions-file: .github/test-fixtures/r-package-versions.txt
      - name: Verify versions file was available in the workspace
        run: test -f .github/test-fixtures/r-package-versions.txt

  test-draft-release-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./draft-release
        with:
          github-token: ${{ github.token }}
          version-tag: v0.7.3
          ccbr-actions-version: main
          dry-run: true

  test-draft-release-container:
    runs-on: ubuntu-latest
    container: nciccbr/ccbr_actions:latest@sha256:1f4e65a53499f7a44a01f66f4ea72657c55bae8ccd56384b113b2e959a32c947
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./draft-release
        with:
          github-token: ${{ github.token }}
          version-tag: v0.7.3
          dry-run: true

  test-post-release-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./post-release
        with:
          github-token: ${{ github.token }}
          ccbr-actions-version: main
          dry-run: true

  test-post-release-container:
    runs-on: ubuntu-latest
    container: nciccbr/ccbr_actions:latest@sha256:1f4e65a53499f7a44a01f66f4ea72657c55bae8ccd56384b113b2e959a32c947
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./post-release
        with:
          github-token: ${{ github.token }}
          dry-run: true

  build-status:
    # https://github.com/orgs/community/discussions/4324#discussioncomment-3477871
    runs-on: ubuntu-latest
    needs:
      - build
      - test-actions-host
      - test-actions-container
      - test-changed-files-host
      - test-changed-files-container
      - test-build-docker-host
      - test-build-docker-container
      - test-install-r-pak-host
      - test-install-r-pak-container
      - test-draft-release-host
      - test-draft-release-container
      - test-post-release-host
      - test-post-release-container
    if: always()
    steps:
      - name: Successful build
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing build
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
