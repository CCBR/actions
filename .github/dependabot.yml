  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      runtime:
        dependency-type: "production"
        exclude-patterns:
          - "ccbr_tools"
      build:
        patterns:
          - "ccbr_tools"
          - "setuptools"
          - "setuptools-scm"
          - "wheel"
      dev:
        dependency-type: "development"
    cooldown:
      default-days: 7
