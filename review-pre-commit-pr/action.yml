name: review-pre-commit-pr
description: "Review a pre-commit.ci autoupdate PR: approve and attempt auto-merge when only rev: versions changed (or a rev alias tag points at the same commit), otherwise request a human reviewer"
author: "Kelly Sovacool"

inputs:
  github-token:
    description: "GitHub API token (e.g. a CCBR-bot token generated with actions/create-github-app-token)."
    required: true
  pr-number:
    description: "Pull request number to review."
    required: true
  repo:
    description: "Repository full name (e.g. CCBR/actions)."
    required: true
    default: "${{ github.repository }}"
  reviewer:
    description: "GitHub username to request as reviewer when the PR requires human review."
    required: false
  force-review:
    description: "Re-submit the review and reviewer request even when the PR already has an approval."
    required: false
    default: "false"
  ccbr-actions-version:
    description: "The version of CCBR/actions to install when running outside the ccbr_actions container (branch, tag, or 'latest')."
    required: true
    default: "latest"
  python-version:
    description: "Python version to use."
    required: true
    default: "3.14"

runs:
  using: "composite"
  steps:
    - name: Detect ccbr_actions container
      id: detect-container
      shell: bash
      # env vars baked into the container image are not visible to the `env` context in `if:` expressions
      run: echo "in-container=${CCBR_ACTIONS_DOCKER:-false}" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@v6
      if: ${{ steps.detect-container.outputs.in-container != 'true' }}
      with:
        python-version: "${{ inputs.python-version }}"
        cache: "pip"
    - name: Install ccbr_actions
      if: ${{ steps.detect-container.outputs.in-container != 'true' }}
      shell: bash
      run: pip install --upgrade pip git+https://github.com/CCBR/actions.git@${{ inputs.ccbr-actions-version }}
    - name: Review pre-commit.ci PR
      shell: python {0}
      run: |
        import os

        from ccbr_actions.pre_commit import review_pre_commit_pr
        result = review_pre_commit_pr(
          repo="${{ inputs.repo }}",
          pr_number="${{ inputs.pr-number }}",
          reviewer="${{ inputs.reviewer }}",
          force_review="${{ inputs.force-review }}".lower() == "true",
          token=os.environ["GITHUB_TOKEN"],
        )
        print(f"Action completed with automatic_approval={result}")
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
